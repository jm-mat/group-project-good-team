project_name: "FPGA Fall Prevention System"
project_type: "hybrid"

impl_claim: "A 32x32 grayscale video frame is classified as irrelevant, safe, or unsafe, and repeated unsafe predictions notify the mobile application."

languages: ["python", "verilog", "javascript", "typescript"]
hardware_required: true

setup:
  - "pip install -r requirements.txt"
  - "cd src/FPGA_Mobile_App && npm install"

build:
  - "python -m compileall -q src/software tests"
  - "cd src/FPGA_Mobile_App && npm run lint"

test:
  - "pytest tests/ -v"

run:
  - "python src/software/predictimage.py"
  - "python src/software/predictvideo.py"

mock_mode:
  available: true
  commands:
    - "pytest tests/test_mock_e2e.py -v"
    - "node src/FPGA_Mobile_App/server/server.js"
    - "python tests/mock_E2E.py http://localhost:3000"

demo:
  video: "https://youtu.be/..."
  screenshots:
   -
   -
   -
   -
notes: "The grader can run the software and mock mobile-server tests without FPGA hardware. The RTL/HLS integration and Basys3 hardware operation will be verified on the team's hardware and are demonstrated in the video. The Vivado testbench remains available under src/Hardware_Files/sim for optional reproduction."
